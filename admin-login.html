<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Sign In — Roster Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>
      <main class="app-main">
        <div class="page page--narrow">
          <header class="page-header">
            <h1 class="page-title">Admin sign in</h1>
            <p class="page-lede">
              Admin accounts are created in the Supabase dashboard under Authentication → Users.
              There's no public sign-up here on purpose.
            </p>
          </header>

          <div id="login-banner"></div>

          <form class="auth-form" id="login-form">
            <label class="field-label">
              Email
              <input class="field-input" type="email" id="email" required />
            </label>
            <label class="field-label">
              Password
              <input class="field-input" type="password" id="password" required />
            </label>
            <button class="btn-primary" type="submit" id="submit-btn">Sign in</button>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="js/pages/admin-login.js"></script>
  </body>
</html>
