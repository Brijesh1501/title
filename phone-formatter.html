<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Number Formatter — Roster Ops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>
      <main class="app-main">
        <div class="page">
          <header class="page-header">
            <h1 class="page-title">Phone Number Formatter</h1>
            <p class="page-lede">
              Recognizes 10-digit and +1-prefixed US numbers in almost any punctuation and
              rewrites them as +1 XXX-XXX-XXXX. Text around the number is left untouched.
            </p>
          </header>

          <div class="tool-panel">
            <div class="tool-panel-input">
              <div class="field-row">
                <label class="upload-button">
                  Upload CSV
                  <input type="file" id="file-input" accept=".csv" hidden />
                </label>
                <button class="btn-ghost" id="clear-upload-btn" style="display: none">Clear file</button>
              </div>

              <textarea
                class="textarea"
                id="phones-textarea"
                rows="10"
                placeholder="One phone number (or line of text containing one) per line"
              >(408) 368-1105
+12129280800
1-860-558-5857
1 801-358-3285
+1 650-714-3286</textarea>

              <p class="hint" id="upload-hint" style="display: none"></p>

              <button class="btn-primary" id="format-btn">Format numbers</button>
            </div>
          </div>

          <div class="results-block" id="results-block" style="display: none">
            <div class="results-header">
              <h2>Results</h2>
              <button class="btn-secondary" id="export-btn">Download CSV</button>
            </div>
            <table class="data-table">
              <thead id="results-thead"></thead>
              <tbody id="results-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="js/pages/phone.js"></script>
  </body>
</html>
